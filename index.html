<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/resume.css">
</head>
<body>
  <header class="app-header">
    <h1>Resume Builder</h1>
  </header>

  <main class="app-main">
    <section class="editor-panel" aria-label="Resume editor">
      <h2>Edit Resume</h2>
      <!-- Form sections will be added here -->
    </section>

    <section class="preview-panel" aria-label="Resume preview">
      <h2>Preview</h2>
      <article id="resume-preview" class="resume">
        <!-- Live preview will render here -->
      </article>
    </section>
  </main>

  <script src="js/state.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
